name: PR API Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  api-check:
    runs-on: ubuntu-latest

    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed APIs
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          APIS=$(echo "$CHANGED" \
            | grep -E '.*/(json-rpc|rest-api)/' || true \
            | awk -F/ '{print $1"/"$2}' \
            | sort -u)

          echo "apis<<EOF" >> "$GITHUB_OUTPUT"
          echo "$APIS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Enforce VERSION bump on spec change
        shell: bash
        run: |
          set -euo pipefail

          APIS="${{ steps.detect.outputs.apis }}"
          [[ -z "$APIS" ]] && exit 0

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          while IFS= read -r API; do
            SPEC_CHANGED=$(echo "$CHANGED" | grep -E "$API/(openrpc|openapi)\.json" || true)
            VERSION_CHANGED=$(echo "$CHANGED" | grep -E "$API/VERSION" || true)

            if [[ -n "$SPEC_CHANGED" && -z "$VERSION_CHANGED" ]]; then
              echo "ERROR: Spec changed but VERSION not updated for $API"
              exit 1
            fi
          done <<< "$APIS"

      - name: Enforce CHANGELOG section for version
        shell: bash
        run: |
          set -euo pipefail

          APIS="${{ steps.detect.outputs.apis }}"
          [[ -z "$APIS" ]] && exit 0

          while IFS= read -r API; do
            VERSION=$(tr -d '[:space:]' < "$API/VERSION")

            if ! grep -Eq "^##[[:space:]]+\[$VERSION\]([[:space:]]+-.*)?$" "$API/CHANGELOG.md"; then
              echo "ERROR: CHANGELOG for $API does not contain section for version [$VERSION]"
              exit 1
            fi
          done <<< "$APIS"

      - name: Lint OpenAPI / OpenRPC
        shell: bash
        run: |
          set -euo pipefail

          APIS="${{ steps.detect.outputs.apis }}"
          [[ -z "$APIS" ]] && exit 0

          while IFS= read -r API; do
            if [[ "$API" == */json-rpc ]]; then
              npx @redocly/cli@2.15.0 lint "$API/openrpc.json"
            else
              npx @redocly/cli@2.15.0 lint "$API/openapi.json"
            fi
          done <<< "$APIS"
