name: PR API Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test spec validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate all API specs and stable identities
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate_specs.py --base-ref "$BASE"

  api-check:
    runs-on: ubuntu-latest

    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      REDOCLY_TELEMETRY: 'off'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed APIs
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "$BASE" HEAD)

          APIS=$(printf '%s\n' "$CHANGED" \
            | awk -F/ 'NF >= 3 && ($2 == "json-rpc" || $2 == "rest-api") {print $1"/"$2}' \
            | sort -u)

          echo "apis<<EOF" >> "$GITHUB_OUTPUT"
          echo "$APIS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Enforce VERSION bump on spec change
        env:
          APIS: ${{ steps.detect.outputs.apis }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -z "$APIS" ]] && exit 0

          while IFS= read -r API; do
            SPEC_CHANGED=$(git diff --name-only "$BASE" HEAD -- "$API/openrpc-v*.json" "$API/openapi-v*.json")
            VERSION_CHANGED=$(git diff --name-only "$BASE" HEAD -- "$API/VERSION")

            if [[ -n "$SPEC_CHANGED" && -z "$VERSION_CHANGED" ]]; then
              echo "ERROR: Spec changed but VERSION not updated for $API"
              exit 1
            fi
          done <<< "$APIS"

      - name: Enforce CHANGELOG section for version
        env:
          APIS: ${{ steps.detect.outputs.apis }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -z "$APIS" ]] && exit 0

          while IFS= read -r API; do
            VERSION=$(tr -d '[:space:]' < "$API/VERSION")

            if ! grep -Eq "^##[[:space:]]+\[$VERSION\]([[:space:]]+-.*)?$" "$API/CHANGELOG.md"; then
              echo "ERROR: CHANGELOG for $API does not contain section for version [$VERSION]"
              exit 1
            fi
          done <<< "$APIS"

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.apis != ''
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Lint OpenAPI / OpenRPC
        env:
          APIS: ${{ steps.detect.outputs.apis }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -z "$APIS" ]] && exit 0

          while IFS= read -r API; do
            if [[ "$API" == */json-rpc ]]; then
              mapfile -t SPECS < <(find "$API" -maxdepth 1 -type f -name 'openrpc-v*.json' | sort)
            else
              mapfile -t SPECS < <(find "$API" -maxdepth 1 -type f -name 'openapi-v*.json' | sort)
            fi

            if [[ ${#SPECS[@]} -eq 0 ]]; then
              echo "ERROR: No spec files found for $API"
              exit 1
            fi

            for SPEC in "${SPECS[@]}"; do
              npx --yes @redocly/cli@2.15.0 lint "$SPEC"
            done
          done <<< "$APIS"
