name: PR API Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed APIs
        id: detect
        shell: bash
        run: |
          set -e

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          APIS=$(echo "$CHANGED" \
            | grep -E '.*/(json-rpc|rest-api)/' \
            | awk -F/ '{print $1"/"$2}' \
            | sort -u)

          echo "apis<<EOF" >> "$GITHUB_OUTPUT"
          echo "$APIS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Enforce VERSION bump
        shell: bash
        run: |
          set -e

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          for API in ${{ steps.detect.outputs.apis }}; do
            SPEC_CHANGED=$(echo "$CHANGED" | grep -E "$API/.*/(openrpc|openapi)\.json" || true)
            VERSION_CHANGED=$(echo "$CHANGED" | grep -E "$API/.*/VERSION" || true)

            if [[ -n "$SPEC_CHANGED" && -z "$VERSION_CHANGED" ]]; then
              echo "ERROR: Spec changed but VERSION not updated for $API"
              exit 1
            fi
          done

      - name: Validate API specs
        shell: bash
        run: |
          set -e

          for API in ${{ steps.detect.outputs.apis }}; do
            if [[ "$API" == */json-rpc ]]; then
              npm install -g @open-rpc/validator
              openrpc-validator validate "$API/json-rpc/openrpc.json"
            else
              npm install -g @redocly/cli
              redocly lint "$API/rest-api/openapi.json"
            fi
          done
