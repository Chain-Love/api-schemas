name: API Spec Release

on:
  push:
    branches: [ main ]
    paths:
      - '**/json-rpc/**'
      - '**/rest-api/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        run: |
          set -e

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")

          MATRIX=$(echo "$CHANGED" \
            | grep -E '.*/(json-rpc|rest-api)/VERSION' \
            | awk -F/ '{print $1"/"$2}' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        api: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          VERSION=$(cat ${{ matrix.api }}/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve spec file
        id: spec
        shell: bash
        run: |
          set -e

          API="${{ matrix.api }}"
          API_TYPE=$(echo "$API" | cut -d/ -f2)

          case "$API_TYPE" in
            json-rpc)
              SPEC_FILE="openrpc.json"
              ;;
            rest-api)
              SPEC_FILE="openapi.json"
              ;;
            *)
              echo "Unknown API type: $API_TYPE"
              exit 1
              ;;
          esac

          FULL_PATH="$API/$SPEC_FILE"

          if [[ ! -f "$FULL_PATH" ]]; then
            echo "ERROR: Spec file not found: $FULL_PATH"
            exit 1
          fi

          echo "spec_file=$FULL_PATH" >> "$GITHUB_OUTPUT"
          echo "api_type=$API_TYPE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          API="${{ matrix.api }}"
          VERSION="${{ steps.version.outputs.version }}"
          SPEC_FILE="${{ steps.spec.outputs.spec_file }}"

          BLOCKCHAIN=$(echo "$API" | cut -d/ -f1)
          API_TYPE=$(echo "$API" | cut -d/ -f2)

          TAG="${BLOCKCHAIN}-${API_TYPE}-v${VERSION}"

          extract_changelog() {
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]"{flag=1; next}
              $0 ~ "^## \\[" && flag {exit}
              flag {print}
            ' "$API/CHANGELOG.md"
          }

          NOTES=$(extract_changelog)

          if [[ -z "$NOTES" ]]; then
            echo "ERROR: Missing changelog section for $VERSION"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            "$SPEC_FILE" \
            "$API/CHANGELOG.md" \
            --title "$TAG" \
            --notes "$NOTES"
