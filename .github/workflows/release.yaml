name: API Spec Release

on:
  push:
    branches: [ main ]
    paths:
      - '**/json-rpc/**'
      - '**/rest-api/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'redocly.yaml'

permissions:
  contents: read

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate all API specs before publishing
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/validate_specs.py
          else
            python3 scripts/validate_specs.py --base-ref "$BEFORE"
          fi

  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")

          MATRIX=$(printf '%s\n' "$CHANGED" \
            | awk -F/ 'NF == 3 && ($2 == "json-rpc" || $2 == "rest-api") && $3 == "VERSION" {print $1"/"$2}' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  release:
    needs: [detect, validate-specs]
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        api: ${{ fromJson(needs.detect.outputs.matrix) }}

    env:
      API: ${{ matrix.api }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          VERSION=$(cat "$API/VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve spec assets
        id: spec
        shell: bash
        run: |
          set -euo pipefail

          API_TYPE=$(echo "$API" | cut -d/ -f2)

          case "$API_TYPE" in
            json-rpc)
              ASSET_PATTERN="openrpc-v*.json"
              ;;
            rest-api)
              ASSET_PATTERN="openapi-v*.json"
              ;;
            *)
              echo "Unknown API type: $API_TYPE"
              exit 1
              ;;
          esac

          mapfile -t ASSETS < <(find "$API" -maxdepth 1 -type f -name "$ASSET_PATTERN" | sort)


          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "ERROR: No spec assets found for $API"
            exit 1
          fi

          echo "assets<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${ASSETS[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "api_type=$API_TYPE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ steps.spec.outputs.assets }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BLOCKCHAIN=$(echo "$API" | cut -d/ -f1)
          API_TYPE=$(echo "$API" | cut -d/ -f2)

          TAG="${BLOCKCHAIN}-${API_TYPE}-v${VERSION}"

          extract_changelog() {
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]"{flag=1; next}
              $0 ~ "^## \\[" && flag {exit}
              flag {print}
            ' "$API/CHANGELOG.md"
          }

          NOTES=$(extract_changelog)

          if [[ -z "$NOTES" ]]; then
            echo "ERROR: Missing changelog section for $VERSION"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          mapfile -t ASSET_FILES <<< "$ASSETS"

          gh release create "$TAG" \
            "${ASSET_FILES[@]}" \
            "$API/CHANGELOG.md" \
            --title "$TAG" \
            --notes "$NOTES"
